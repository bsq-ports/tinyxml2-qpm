name: NDK build

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Fernthedev/qpm-action@v2
      - name: Build and package
        run: qpm2 qpkg
      - name: Create QMOD
        run: qpm2 qmod zip
      - uses: actions/upload-artifact@v4
        with:
          name: tinyxml2
          path: |
            tinyxml2.qpkg
            build/libtinyxml2.so
            build/debug/libtinyxml2.so
            tinyxml2.qmod
          if-no-files-found: error
