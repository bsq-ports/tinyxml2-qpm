name: NDK build

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.yml'
      - '!.github/workflows/build-ndk.yml'
      - '**.json'
      - '!qpm2.json'
      - '!qpm2.shared.json'
      - '!mod.template.json'
      - '**.txt'
      - '!CMakeLists.txt'
      - '**.ps1'
      - '!build.ps1'
      - '!createqmod.ps1'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: main


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v3
      - uses: Fernthedev/qpm-action@v2
      - name: Build and package
        run: qpm2 qpkg
      - name: Create QMOD
        run: qpm2 qmod zip
      - uses: actions/upload-artifact@v4
        with:
          name: tinyxml2
          path: |
            tinyxml2.qpkg
            build/libtinyxml2.so
            build/debug/libtinyxml2.so
            tinyxml2.qmod
          if-no-files-found: error
