name: Publish QPM Package

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v3
      - uses: Fernthedev/qpm-action@v2
        with:
          publish: late
          publish_token: ${{ secrets.QPM_KEY }}
