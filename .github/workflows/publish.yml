name: Publish QPM Package

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Fernthedev/qpm-action@v2
        with:
          publish: late
          publish_token: ${{ secrets.QPM_KEY }}
